api.http.host: "0.0.0.0"

# The pairing logic needs events handled one at a time, in order.
pipeline.workers: 1
pipeline.ordered: true

# Keep documents Elasticsearch rejects with a 400 or 404, like mapping errors.
dead_letter_queue.enable: true

# Uncomment to survive a restart. Use checkpoint writes 1 for the most durable
# queue, at a cost in speed. See "What to watch out for" in the article.
# queue.type: persisted
# queue.checkpoint.writes: 1
