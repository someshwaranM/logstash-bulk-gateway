api.http.host: "0.0.0.0"

# The pairing logic needs events handled one at a time, in order.
pipeline.workers: 1
pipeline.ordered: true

# Keep documents Elasticsearch rejects with a 400 or 404, like mapping errors.
dead_letter_queue.enable: true

# The persistent queue keeps events across a restart, but this pipeline keeps
# its pairing queues in memory. In a kill -9 test, queue.checkpoint.writes: 1
# lost every document of a request that was split across two batches (replayed
# source lines came back without their action lines and were rejected as
# orphans). The default checkpoint settings recovered them in the same test,
# but nothing guarantees that. Treat the persistent queue as a help, not a
# guarantee.
# queue.type: persisted
