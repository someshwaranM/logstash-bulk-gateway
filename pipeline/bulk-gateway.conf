input {
  http {
    port => 8080

    # Keep the input from adding its own fields (http, url, host, user_agent) to
    # every event, so they can't collide with the client's document fields.
    ecs_compatibility => disabled
    request_headers_target_field => "[@metadata][headers]"
    remote_host_target_field     => "[@metadata][remote_host]"

    # The input picks a codec from the request's Content-Type, and by default it
    # only maps application/json, to the json codec. An empty map plus a
    # json_lines fallback means every content type is split into lines.
    # 20 MB is the largest single line (one action or one document) we accept.
    codec => json_lines { decode_size_limit_bytes => 20971520 }
    additional_codecs => {}
  }
}

filter {
  # 0. A client can put its own @metadata key in a document, and Logstash merges
  #    it into the event. Keep only what the input put there.
  ruby {
    code => '
      md = event.get("[@metadata]") || {}
      md.keys.each { |k| event.remove("[@metadata][#{k}]") unless %w[headers remote_host].include?(k) }
    '
  }

  # 1. Which request and which tenant does this line belong to?
  #    The input lowercases header names and turns dashes into underscores.
  ruby {
    code => '
      h = event.get("[@metadata][headers]") || {}
      req = h["x_request_id"]
      tenant = h["x_tenant_id"]
      if req.nil? || req.empty? || tenant.nil? || tenant.empty?
        event.tag("missing_headers")
        event.set("[@metadata][reject]", true)
      elsif tenant !~ /\A[a-z0-9_-]{1,64}\z/
        event.tag("invalid_tenant")
        event.set("[@metadata][reject]", true)
      else
        event.set("[@metadata][req_id]", req)
        event.set("[@metadata][tenant]", tenant)
      end
    '
  }

  # A client @timestamp that isn't ISO 8601 fails to parse. Elasticsearch
  # accepts epoch milliseconds, so convert those back. Anything else stays
  # tagged and goes to stdout.
  if "_timestampparsefailure" in [tags] {
    ruby {
      code => '
        v = event.get("_@timestamp")
        v = Integer(v, 10) if v.is_a?(String) && v.match?(/\A\d+\z/)
        if v.is_a?(Integer)
          event.timestamp = LogStash::Timestamp.at(v / 1000.0)
          event.remove("_@timestamp")
          t = (event.get("tags") || []) - ["_timestampparsefailure"]
          t.empty? ? event.remove("tags") : event.set("tags", t)
        end
      '
    }
  }

  if [@metadata][req_id] {

    # 2. Is this an action line (index/create/update/delete)?
    #    Known limit: a document with a top-level field named index, create,
    #    update or delete that holds an object looks like an action line.
    ruby {
      code => '
        %w[index create update delete].each do |k|
          if event.get(k).is_a?(Hash)
            event.set("[@metadata][is_action]", true)
            event.set("[@metadata][op]", k)
            event.set("[@metadata][op_id]", event.get("[#{k}][_id]"))
            break
          end
        end
      '
    }

    # 3. Pair each source line with the action line before it
    if [@metadata][is_action] {
      if [@metadata][op] == "delete" {
        # delete has no source line, so it goes straight to the output
        if [@metadata][op_id] {
          mutate {
            add_field => {
              "[@metadata][action]" => "delete"
              "[@metadata][doc_id]" => "%{[@metadata][op_id]}"
            }
          }
        } else {
          mutate {
            add_tag   => ["missing_id"]
            add_field => { "[@metadata][reject]" => "true" }
          }
        }
      } else {
        # index/create/update: remember it and wait for the source line.
        # The queue key includes the tenant, so two tenants that happen to reuse
        # a request ID can't mix their queues.
        # All timeout options must live in this one aggregate filter. The values
        # are generous on purpose: if Elasticsearch is slow, the worker can sit
        # in the output for a long time between an action line and its source
        # line, and a queue that expires in between turns the source line into
        # an orphan. An open queue only costs memory.
        aggregate {
          id => "queue_push"
          task_id => "%{[@metadata][tenant]}:%{[@metadata][req_id]}"
          code => '
            map["pending"] ||= []
            map["pending"] << {
              "op" => event.get("[@metadata][op]"),
              "id" => event.get("[@metadata][op_id]")
            }
          '
          timeout => 3600
          inactivity_timeout => 300
        }
        drop { }
      }
    } else {
      aggregate {
        id => "queue_pop"
        task_id => "%{[@metadata][tenant]}:%{[@metadata][req_id]}"
        code => '
          op = (map["pending"] || []).shift
          if op.nil?
            event.tag("orphan_source_line")
            event.set("[@metadata][reject]", true)
          elsif op["op"] == "update" && op["id"].nil?
            event.tag("missing_id")
            event.set("[@metadata][reject]", true)
          else
            event.set("[@metadata][action]", op["op"])
            event.set("[@metadata][doc_id]", op["id"]) if op["id"]
          end
        '
      }
    }
  }

  # 4. The gateway rules, applied only to paired events
  if [@metadata][action] {
    # An update source has to be exactly { "doc": {...} }. The output wraps
    # updates itself, so unwrap doc first. script, upsert, doc_as_upsert and the
    # other update options aren't supported, so reject them instead of letting
    # them end up as fields in the document.
    if [@metadata][action] == "update" {
      ruby {
        code => '
          d = event.get("doc")
          extra = event.to_hash.keys - ["doc", "@timestamp", "@version"]
          if !d.is_a?(Hash) || !extra.empty?
            event.tag("unsupported_update")
            event.set("[@metadata][reject]", true)
          else
            event.remove("doc")
            ts = d.delete("@timestamp")
            d.each { |k, v| event.set(k, v) }
            # @timestamp has to be set as a Timestamp, not a plain value
            if ts
              event.timestamp = ts.is_a?(Integer) ? LogStash::Timestamp.at(ts / 1000.0) : LogStash::Timestamp.parse_iso8601(ts.to_s)
              event.set("[@metadata][keep_timestamp]", true)
            end
          end
        '
      }
    }

    # drop debug noise
    if [level] == "debug" { drop { } }

    # mask the local part of a top-level email field: jane.doe@x.com -> j***@x.com
    if [email] {
      mutate { gsub => ["email", "^(.)[^@]*@", "\1***@"] }
    }

    # route by the tenant header, ignoring whatever index the client asked for
    mutate { add_field => { "[@metadata][index]" => "orders-%{[@metadata][tenant]}" } }

    # Logstash adds @version to every event. @timestamp stays on index and
    # create, but an update must not overwrite it, unless the client sent one.
    mutate { remove_field => ["@version"] }
    if [@metadata][action] == "update" and ![@metadata][keep_timestamp] {
      mutate { remove_field => ["@timestamp"] }
    }
  }
}

output {
  # Rejected input stays visible on stdout instead of landing in Elasticsearch:
  # anything the pipeline flagged, plus the failure tags Logstash adds itself.
  if [@metadata][reject] or "_jsonparsefailure" in [tags] or "_timestampparsefailure" in [tags] or "_rubyexception" in [tags] or "_tagsparsefailure" in [tags] {
    stdout { codec => rubydebug { metadata => true } }
  } else if [@metadata][doc_id] {
    elasticsearch {
      hosts       => ["${ES_HOST}"]
      user        => "${ES_USER}"
      password    => "${ES_PASSWORD}"
      action      => "%{[@metadata][action]}"
      index       => "%{[@metadata][index]}"
      document_id => "%{[@metadata][doc_id]}"
    }
  } else {
    # index or create without an _id: Elasticsearch generates one
    elasticsearch {
      hosts    => ["${ES_HOST}"]
      user     => "${ES_USER}"
      password => "${ES_PASSWORD}"
      action   => "%{[@metadata][action]}"
      index    => "%{[@metadata][index]}"
    }
  }
}
