input {
  http {
    port => 8080

    # Keep the input from adding its own fields (http, url, host, user_agent) to
    # every event, so they can't collide with the client's document fields.
    ecs_compatibility => disabled
    request_headers_target_field => "[@metadata][headers]"
    remote_host_target_field     => "[@metadata][remote_host]"

    # The input picks the codec from the request's Content-Type. Map every
    # content type a bulk client might send, and use json_lines as the fallback.
    codec => json_lines
    additional_codecs => {
      "application/json"     => "json_lines"
      "application/x-ndjson" => "json_lines"
    }
  }
}

filter {
  # 1. Which request and which tenant does this line belong to?
  #    The input lowercases header names and turns dashes into underscores.
  ruby {
    code => '
      h = event.get("[@metadata][headers]") || {}
      req = h["x_request_id"]
      tenant = h["x_tenant_id"]
      if req.nil? || req.empty? || tenant.nil? || tenant.empty?
        event.tag("missing_headers")
      elsif tenant !~ /\A[a-z0-9_-]+\z/
        event.tag("invalid_tenant")
      else
        event.set("[@metadata][req_id]", req)
        event.set("[@metadata][tenant]", tenant)
      end
    '
  }

  if [@metadata][req_id] {

    # 2. Is this an action line (index/create/update/delete)?
    #    Known limit: a document with a top-level field named index, create,
    #    update or delete that holds an object looks like an action line.
    ruby {
      code => '
        %w[index create update delete].each do |k|
          if event.get(k).is_a?(Hash)
            event.set("[@metadata][is_action]", true)
            event.set("[@metadata][op]", k)
            event.set("[@metadata][op_id]", event.get("[#{k}][_id]"))
            break
          end
        end
      '
    }

    # 3. Pair each source line with the action line before it
    if [@metadata][is_action] {
      if [@metadata][op] == "delete" {
        # delete has no source line, so it goes straight to the output
        if [@metadata][op_id] {
          mutate {
            add_field => {
              "[@metadata][action]" => "delete"
              "[@metadata][doc_id]" => "%{[@metadata][op_id]}"
            }
          }
        } else {
          mutate { add_tag => ["missing_id"] }
        }
      } else {
        # index/create/update: remember it and wait for the source line.
        # All timeout options must live in this one aggregate filter.
        aggregate {
          task_id => "%{[@metadata][req_id]}"
          code => '
            map["pending"] ||= []
            map["pending"] << {
              "op" => event.get("[@metadata][op]"),
              "id" => event.get("[@metadata][op_id]")
            }
          '
          timeout => 300
          inactivity_timeout => 30
        }
        drop { }
      }
    } else {
      aggregate {
        task_id => "%{[@metadata][req_id]}"
        code => '
          op = (map["pending"] || []).shift
          if op.nil?
            event.tag("orphan_source_line")
          elsif op["op"] == "update" && op["id"].nil?
            event.tag("missing_id")
          else
            event.set("[@metadata][action]", op["op"])
            event.set("[@metadata][doc_id]", op["id"]) if op["id"]
          end
        '
      }
    }
  }

  # 4. The gateway rules, applied only to paired events
  if [@metadata][action] {
    # update sources arrive as { "doc": {...} }; the output wraps them again
    if [@metadata][action] == "update" and [doc] {
      ruby {
        code => '
          d = event.get("doc")
          event.remove("doc")
          d.each { |k, v| event.set(k, v) } if d.is_a?(Hash)
        '
      }
    }

    # drop debug noise
    if [level] == "debug" { drop { } }

    # mask the local part of a top-level email field: jane.doe@x.com -> j***@x.com
    if [email] {
      mutate { gsub => ["email", "^(.)[^@]*@", "\1***@"] }
    }

    # route by the tenant header, ignoring whatever index the client asked for
    mutate { add_field => { "[@metadata][index]" => "orders-%{[@metadata][tenant]}" } }

    # Logstash adds @version to every event. @timestamp stays on index and
    # create, but an update must not overwrite it.
    mutate { remove_field => ["@version"] }
    if [@metadata][action] == "update" {
      mutate { remove_field => ["@timestamp"] }
    }
  }
}

output {
  if "missing_headers" in [tags] or "invalid_tenant" in [tags] or "orphan_source_line" in [tags] or "missing_id" in [tags] {
    # rejected input stays visible instead of landing in Elasticsearch
    stdout { codec => rubydebug { metadata => true } }
  } else if [@metadata][doc_id] {
    elasticsearch {
      hosts       => ["${ES_HOST}"]
      user        => "${ES_USER}"
      password    => "${ES_PASSWORD}"
      action      => "%{[@metadata][action]}"
      index       => "%{[@metadata][index]}"
      document_id => "%{[@metadata][doc_id]}"
    }
  } else {
    # index or create without an _id: Elasticsearch generates one
    elasticsearch {
      hosts    => ["${ES_HOST}"]
      user     => "${ES_USER}"
      password => "${ES_PASSWORD}"
      action   => "%{[@metadata][action]}"
      index    => "%{[@metadata][index]}"
    }
  }
}
